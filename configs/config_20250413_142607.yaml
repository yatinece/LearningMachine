data_source:
  type: ceph
  ceph: null
  local: null
  file_name: my_data.csv
  file_format: csv
  read_options:
    encoding: utf-8
    delimiter: ','
    header: true
    na_values:
    - NA
    - 'null'
    - ''
model_settings:
  target_variable: churn
  features:
  - tenure
  - monthly_charges
  - total_charges
  - contract_type
  - payment_method
  - internet_service
  categorical_features: []
  feature_engineering:
    scaling: standard
    handling_missing: median
    feature_selection:
      enabled: true
      method: rfe
      n_features: 10
model:
  type: xgboost
  xgboost: null
  catboost: null
hyperparameter_tuning:
  enabled: false
  method: bayesian
  cv_folds: 5
  scoring: roc_auc
  n_trials: 50
  xgboost_params:
    n_estimators:
    - 50
    - 100
    - 200
    - 300
    - 500
    learning_rate:
    - 0.01
    - 0.05
    - 0.1
    - 0.2
    max_depth:
    - 3
    - 4
    - 5
    - 6
    - 8
    - 10
    subsample:
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 1.0
    colsample_bytree:
    - 0.6
    - 0.7
    - 0.8
    - 0.9
    - 1.0
    min_child_weight:
    - 1
    - 3
    - 5
    - 7
    gamma:
    - 0
    - 0.1
    - 0.2
    - 0.3
    - 0.4
  catboost_params:
    iterations:
    - 100
    - 250
    - 500
    - 1000
    learning_rate:
    - 0.01
    - 0.05
    - 0.1
    - 0.2
    depth:
    - 4
    - 6
    - 8
    - 10
    l2_leaf_reg:
    - 1
    - 3
    - 5
    - 7
    - 9
    border_count:
    - 32
    - 64
    - 128
    - 254
    bagging_temperature:
    - 0
    - 1
    - 10
training:
  train_test_split:
    test_size: 0.2
    validation_size: 0.15
    stratify: true
    random_state: 42
  early_stopping:
    enabled: true
    patience: 20
    monitor: val_auc
    mode: max
  callbacks:
  - type: model_checkpoint
    monitor: val_auc
    mode: max
    save_best_only: true
  - type: learning_rate_scheduler
    monitor: val_loss
    mode: min
    factor: 0.5
    patience: 10
experiment_tracking:
  enabled: true
  backend: mlflow
  mlflow:
    tracking_uri: http://mlflow-server:5000
    experiment_name: churn-prediction
    run_name: xgboost-run-${RUN_ID}
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - roc_auc
  - confusion_matrix
  - feature_importance
  artifacts:
  - model_file
  - feature_importance_plot
  - confusion_matrix_plot
  - roc_curve_plot
  - precision_recall_curve
  - calibration_curve
  - hyperparameter_search_results
output:
  save_model: true
  model_format: pickle
  model_path: /models/${MODEL_TYPE}_${RUN_ID}.pkl
  prediction_output:
    enabled: true
    output_type: local
    path: ${OUTPUT_PATH}/predictions_${RUN_ID}.csv
    include_probabilities: true
    include_feature_importance: true
  reports:
    format: html
    output_path: /reports/experiment_report_${RUN_ID}.html
    include_sections:
    - experiment_overview
    - data_profile
    - model_performance
    - feature_importance
    - hyperparameter_tuning_results
    - confusion_matrix
    - roc_curves
    - distribution_plots
